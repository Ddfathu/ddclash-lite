name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install UPX Compressor
        run: sudo apt-get update && sudo apt-get install -y upx-ucl binutils

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download & Compress Mihomo Core (arm64-v8a)
        run: |
          rm -rf app/src/main/jniLibs app/src/main/assets
          mkdir -p app/src/main/jniLibs/arm64-v8a

          echo "[*] Mengunduh core binary..."
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/Prerelease-Alpha | grep "browser_download_url" | grep -i "android-arm64" | head -n 1 | cut -d '"' -f 4)
          [ -z "$DOWNLOAD_URL" ] && DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-android-arm64-v8a.gz"

          curl -sL "$DOWNLOAD_URL" -o core.gz
          gunzip -f core.gz

          BIN_FILE=$(find . -maxdepth 2 -name "mihomo*" -type f ! -name "*.zip" ! -name "*.gz" | head -n 1)
          [ -z "$BIN_FILE" ] && BIN_FILE="core"

          # Pangkas simbol debug
          strip --strip-all "$BIN_FILE" || true

          # Kompres UPX
          upx --best "$BIN_FILE" || true

          chmod 755 "$BIN_FILE"
          mv "$BIN_FILE" app/src/main/jniLibs/arm64-v8a/libclash.so

          echo "[✓] Ukuran asli binary libclash.so:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so

      - name: Setup gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle Wrapper 8.4
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Assemble Debug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
