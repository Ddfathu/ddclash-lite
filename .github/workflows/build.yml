name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets
          
          URL1="https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-android-arm64-v8a-v1.18.10.gz"
          URL2="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-android-arm64-v8a.gz"

          echo "[*] Mendownload binary core..."
          curl -f -L "$URL1" -o core.gz || curl -f -L "$URL2" -o core.gz

          gunzip -f core.gz
          chmod 755 core
          
          # Simpan di dua tempat: jniLibs dan assets
          cp core app/src/main/jniLibs/arm64-v8a/libclash.so
          cp core app/src/main/assets/clash_core
          
          echo "[✓] Core tersimpan di jniLibs dan assets:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so
          ls -lh app/src/main/assets/clash_core

      - name: Setup gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle Wrapper 8.4
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Assemble Debug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
