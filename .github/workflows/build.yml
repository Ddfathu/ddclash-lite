name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets

          echo "[*] Mengambil link unduhan binary Mihomo resmi..."
          # Query daftar aset rilis Prerelease-Alpha untuk mencari paket android-arm64
          DOWNLOAD_URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/Prerelease-Alpha | grep "browser_download_url" | grep -i "android-arm64" | head -n 1 | cut -d '"' -f 4)

          # Jika API rate limit / link kosong, gunakan direct mirror release
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "[!] Menggunakan URL fallback direct..."
            DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-android-arm64-v8a.gz"
          fi

          echo "[*] Unduh core dari: $DOWNLOAD_URL"
          curl -sL "$DOWNLOAD_URL" -o core.gz

          # Verifikasi file terdownload sebelum diekstrak
          if file core.gz | grep -q "gzip compressed data"; then
            echo "[✓] File core.gz valid, mengekstrak..."
            gunzip -f core.gz
          else
            echo "[!] File bukan gzip, mencoba unzip jika berbentuk zip..."
            mv core.gz core.zip
            unzip -o core.zip || mv core.zip core
          fi

          # Temukan binary executable hasil ekstraksi
          BIN_FILE=$(find . -maxdepth 2 -name "mihomo*" -type f ! -name "*.zip" ! -name "*.gz" | head -n 1)
          if [ -z "$BIN_FILE" ]; then
            BIN_FILE="core"
          fi

          chmod 755 "$BIN_FILE"
          cp "$BIN_FILE" app/src/main/jniLibs/arm64-v8a/libclash.so
          cp "$BIN_FILE" app/src/main/assets/clash_core

          echo "[✓] Verifikasi file binary:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so
          ls -lh app/src/main/assets/clash_core

      - name: Setup gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle Wrapper 8.4
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Assemble Debug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
