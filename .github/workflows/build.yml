name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          echo "[*] Mencari URL rilis resmi Mihomo Android arm64-v8a..."
          
          # Ambil URL download binary android arm64 langsung dari rilis GitHub terbaru
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url.*android-arm64-v8a.*\.gz" | head -n 1 | cut -d '"' -f 4)
          
          # Jika rilis stabil kosong, fallback ke prerelease alpha
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/Prerelease-Alpha | grep "browser_download_url.*android-arm64-v8a.*\.gz" | head -n 1 | cut -d '"' -f 4)
          fi

          echo "[*] Downloading from: $DOWNLOAD_URL"
          curl -s -L "$DOWNLOAD_URL" -o core.gz

          # Ekstraksi dan pastikan file binary valid
          gunzip core.gz
          mv core app/src/main/jniLibs/arm64-v8a/libclash.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libclash.so
          
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so
          echo "[✓] Binary core berhasil disiapkan."

      - name: Setup Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
