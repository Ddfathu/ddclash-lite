name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # Daftar direct URL cadangan resmi yang pasti ada filenya
          URL1="https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-android-arm64-v8a-v1.18.10.gz"
          URL2="https://github.com/MetaCubeX/mihomo/releases/download/v1.18.9/mihomo-android-arm64-v8a-v1.18.9.gz"
          URL3="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha/mihomo-android-arm64-v8a.gz"

          echo "[*] Mendownload binary core Mihomo..."
          if curl -f -L "$URL1" -o core.gz; then
            echo "[✓] Berhasil download dari URL1"
          elif curl -f -L "$URL2" -o core.gz; then
            echo "[✓] Berhasil download dari URL2"
          elif curl -f -L "$URL3" -o core.gz; then
            echo "[✓] Berhasil download dari URL3"
          else
            echo "[✗] Semua URL gagal, mendownload mirror linux arm64..."
            curl -f -L "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-arm64-v1.18.10.gz" -o core.gz
          fi

          gunzip -f core.gz
          mv core app/src/main/jniLibs/arm64-v8a/libclash.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libclash.so
          
          echo "[✓] Core siap di jniLibs:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so

      - name: Setup gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Gradle Wrapper 8.4
        run: gradle wrapper --gradle-version 8.4 --distribution-type bin

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Assemble Debug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
