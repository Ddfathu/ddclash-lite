name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          # Coba ambil URL via API resmi dengan otentikasi runner
          DOWNLOAD_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases | jq -r '.[].assets[] | select(.name | test("android-arm64-v8a.*\\.gz$")) | .browser_download_url' | head -n 1)

          # Fallback jika API kosong/gagal parse
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "[!] URL API kosong, beralih ke direct fallback release..."
            DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-android-arm64-v8a-v1.18.10.gz"
          fi

          echo "[*] Downloading core from: $DOWNLOAD_URL"
          curl -f -L "$DOWNLOAD_URL" -o core.gz

          # Ekstrak file gz
          gunzip -f core.gz
          mv core app/src/main/jniLibs/arm64-v8a/libclash.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libclash.so
          
          echo "[✓] File binary siap:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so

      - name: Setup Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
