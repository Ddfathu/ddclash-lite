name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          echo "[*] Mengunduh binary resmi Mihomo Core Android..."
          curl -s -L "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.16/mihomo-android-arm64-v8a-v1.19.16.gz" -o mihomo.gz
          gunzip mihomo.gz
          mv mihomo app/src/main/jniLibs/arm64-v8a/libclash.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libclash.so
          echo "[✓] Core injected into jniLibs as libclash.so"

      - name: Setup Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
