name: Build DDclash Lite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Pre-compiled Mihomo Core (arm64-v8a)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          
          echo "[*] Mengambil link rilis Mihomo Android arm64-v8..."
          DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases" | jq -r '.[].assets[] | select(.name | test("android-arm64-v8.*\\.gz$")) | .browser_download_url' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/Prerelease-Alpha" | jq -r '.assets[] | select(.name | test("android-arm64-v8.*\\.gz$")) | .browser_download_url' | head -n 1)
          fi

          echo "[*] Download URL: $DOWNLOAD_URL"
          curl -f -L "$DOWNLOAD_URL" -o core.gz

          gunzip -f core.gz
          mv core app/src/main/jniLibs/arm64-v8a/libclash.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libclash.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libclash.so

      - name: Ensure gradle.properties exists
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

      - name: Setup Gradle Wrapper
        run: gradle wrapper

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Assemble Debug & Release)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload DDclash APK
        uses: actions/upload-artifact@v4
        with:
          name: DDclash-Lite-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
